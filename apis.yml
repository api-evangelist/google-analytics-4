aid: google-analytics-4
name: Google Analytics 4
description: >-
  Google Analytics 4 (GA4) is Google's event-based web and app analytics platform and the
  successor to Universal Analytics. Its developer surface has three distinct parts: the
  Analytics Data API (analyticsdata.googleapis.com) for running core, pivot, funnel and
  realtime reports and for exporting audiences; the Analytics Admin API
  (analyticsadmin.googleapis.com) for managing accounts, properties, data streams, custom
  dimensions and metrics, key events, access bindings and product links; and the Measurement
  Protocol (www.google-analytics.com/mp/collect) for sending server-side events directly into
  a property. Google publishes no OpenAPI for GA4 — the machine-readable contract is served as
  Google API Discovery documents on the API hosts themselves, alongside canonical protobuf
  service definitions in the googleapis repository. Authentication is Google OAuth 2.0 only
  for the Data and Admin APIs; the Measurement Protocol uses a per-stream shared secret.
