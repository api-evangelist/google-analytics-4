    GoogleAnalyticsAdminV1alphaCalculatedMetric:
      type: object
      description: A definition for a calculated metric.
      properties:
        restrictedMetricType:
          type: array
          items:
            type: string
            enum:
            - RESTRICTED_METRIC_TYPE_UNSPECIFIED
            - COST_DATA
            - REVENUE_DATA
            x-enumDescriptions:
            - Type unknown or unspecified.
            - Metric reports cost data.
            - Metric reports revenue data.
          description: Output only. Types of restricted data that this metric contains.
        formula:
          type: string
          description: 'Required. The calculated metric''s definition. Maximum number of unique referenced
            custom metrics is 5. Formulas supports the following operations: + (addition), - (subtraction),
            - (negative), * (multiplication), / (division), () (parenthesis). Any valid real numbers are
            acceptable that fit in a Long (64bit integer) or a Double (64 bit floating point number).
            Example formula: "( customEvent:parameter_name + cartPurchaseQuantity ) / 2.0"'
        displayName:
          type: string
          description: Required. Display name for this calculated metric as shown in the Google Analytics
            UI. Max length 82 characters.
        calculatedMetricId:
          description: Output only. The ID to use for the calculated metric. In the UI, this is referred
            to as the "API name." The calculated_metric_id is used when referencing this calculated metric
            from external APIs. For example, "calcMetric:{calculated_metric_id}".
          type: string
        invalidMetricReference:
          description: Output only. If true, this calculated metric has a invalid metric reference. Anything
            using a calculated metric with invalid_metric_reference set to true may fail, produce warnings,
            or produce unexpected results.
          type: boolean
        description:
          description: Optional. Description for this calculated metric. Max length of 4096 characters.
          type: string
        name:
          type: string
          description: 'Identifier. Resource name for this CalculatedMetric. Format: ''properties/{property_id}/calculatedMetrics/{calculated_metric_id}'''
        metricUnit:
          description: Required. The type for the calculated metric's value.
          enum:
          - METRIC_UNIT_UNSPECIFIED
          - STANDARD
          - CURRENCY
          - FEET
          - MILES
          - METERS
          - KILOMETERS
          - MILLISECONDS
          - SECONDS
          - MINUTES
          - HOURS
          x-enumDescriptions:
          - MetricUnit unspecified or missing.
          - This metric uses default units.
          - This metric measures a currency.
          - This metric measures feet.
          - This metric measures miles.
          - This metric measures meters.
          - This metric measures kilometers.
          - This metric measures milliseconds.
          - This metric measures seconds.
          - This metric measures minutes.
          - This metric measures hours.
          type: string
