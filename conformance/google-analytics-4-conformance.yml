    conforms: partial
    evidence: >-
      Google does not publish OpenAPI for GA4. It publishes Discovery documents
      (discovery#restDescription) at analyticsdata.googleapis.com/$discovery/rest and
      analyticsadmin.googleapis.com/$discovery/rest, both HTTP 200 and both harvested
