note: >-
  GA4 publishes two separate dated changelogs, one per API. Both are human HTML pages with
  no feed and no machine-readable form; the only machine-readable version marker Google ships
  is the `revision` date stamp inside each Discovery document. Recent window only — the
  live pages remain the source of truth.
