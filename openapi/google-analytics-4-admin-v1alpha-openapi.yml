          - DIMENSION_SCOPE_UNSPECIFIED
          - EVENT
          - USER
          - ITEM
          x-enumDescriptions:
          - Scope unknown or not specified.
          - Dimension scoped to an event.
          - Dimension scoped to a user.
          - Dimension scoped to eCommerce items
        name:
          description: 'Identifier. Resource name for this CustomDimension resource. Format: properties/{property}/customDimensions/{customDimension}'
          type: string
        parameterName:
          description: Required. Immutable. Tagging parameter name for this custom dimension. If this
            is a user-scoped dimension, then this is the user property name. If this is an event-scoped
            dimension, then this is the event parameter name. If this is an item-scoped dimension, then
            this is the parameter name found in the eCommerce items array. May only contain alphanumeric
            and underscore characters, starting with a letter. Max length of 24 characters for user-scoped
