standards:
  - id: oauth2
    conforms: true
    evidence: >-
      securitySchemes declare oauth2 authorizationCode across all four specs, with
      authorizationUrl https://accounts.google.com/o/oauth2/v2/auth and tokenUrl
      https://oauth2.googleapis.com/token.
  - id: rfc8414-oauth-authorization-server-metadata
    conforms: true
    evidence: >-
      https://accounts.google.com/.well-known/oauth-authorization-server returns 200 with
      issuer https://accounts.google.com. Harvested verbatim to well-known/.
  - id: oidc-discovery
    conforms: true
    evidence: >-
      https://accounts.google.com/.well-known/openid-configuration returns 200. GA4 delegates
      identity entirely to Google's OIDC provider.
  - id: rfc6750-bearer-token
    conforms: true
    evidence: "Access tokens are presented as Authorization: Bearer on every Data and Admin API call."
  - id: rfc9116-security-txt
    conforms: true
    evidence: >-
      https://www.google.com/.well-known/security.txt returns 200 with Contact, Policy,
