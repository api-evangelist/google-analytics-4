      properties:
        tokensPerHour:
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAccessQuotaStatus'
          description: Properties can use 50,000 tokens per hour. An API request consumes a single number
            of tokens, and that number is deducted from all of the hourly, daily, and per project hourly
            quotas.
        concurrentRequests:
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAccessQuotaStatus'
          description: Properties can use up to 50 concurrent requests.
        serverErrorsPerProjectPerHour:
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAccessQuotaStatus'
          description: Properties and cloud project pairs can have up to 50 server errors per hour.
        tokensPerDay:
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAccessQuotaStatus'
          description: Properties can use 250,000 tokens per day. Most requests consume fewer than 10
            tokens.
        tokensPerProjectPerHour:
          description: Properties can use up to 25% of their tokens per project per hour. This amounts
            to Analytics 360 Properties can use 12,500 tokens per project per hour. An API request consumes
            a single number of tokens, and that number is deducted from all of the hourly, daily, and
            per project hourly quotas.
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAccessQuotaStatus'
