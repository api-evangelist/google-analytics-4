          - COMPARISON_TYPE_UNSPECIFIED
          - EQUALS
          - EQUALS_CASE_INSENSITIVE
          - CONTAINS
          - CONTAINS_CASE_INSENSITIVE
          - STARTS_WITH
          - STARTS_WITH_CASE_INSENSITIVE
          - ENDS_WITH
