note: >-
  Entity graph derived from the resource-name hierarchy in the harvested OpenAPI paths and
  the $ref graph in components.schemas. GA4 follows Google AIP resource naming, so the
  containment relationships are encoded directly in the URL path — properties/{p}/dataStreams/{d}/eventCreateRules
  is an unambiguous statement that an EventCreateRule belongs to a DataStream which belongs
  to a Property. Nothing here is inferred from prose.
identifier_style:
  form: relative resource name
  examples:
    - accounts/{accountId}
    - properties/{propertyId}
    - properties/{propertyId}/dataStreams/{streamId}
    - properties/{propertyId}/dataStreams/{streamId}/measurementProtocolSecrets/{secretId}
  id_prefixes: none
  note: >-
    GA4 uses no typed id prefixes. Identity is carried by the full path-shaped `name` field
    on every resource, and every operation takes that name rather than a bare id.
