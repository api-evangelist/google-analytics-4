versioning:
  scheme: uri-path
  current: v1beta
  channels:
    - version: v1beta
      status: beta
      apis: [Google Analytics Data API, Google Analytics Admin API]
      docs: https://developers.google.com/analytics/devguides/reporting/data/v1
    - version: v1alpha
      status: alpha
      apis: [Google Analytics Data API, Google Analytics Admin API]
  note: >-
    There is no v1 GA channel. After six years the most stable GA4 API channel is still
    v1beta, and the alpha channel carries the majority of the surface — 166 of the 221
    Admin API operations exist only in v1alpha. Consumers of funnel reports, report tasks,
    subproperty sync, reporting data annotations and property quota snapshots are on alpha
    terms whether they realise it or not.
  revision_stamps:
    data: '20260812'
    admin: '20260810'
    note: >-
      Google stamps each Discovery document with a revision date, which is the closest thing
      to a machine-readable version marker on this API. Both were current within three days
      of this harvest.
deprecation:
  policy_url: null
  ga4_policy_page: none
  ga4_policy_evidence: >-
    No GA4-scoped deprecation policy exists. Both
    https://developers.google.com/analytics/devguides/reporting/data/v1/deprecations and
    https://developers.google.com/analytics/devguides/config/admin/v1/deprecations returned
    404 on 2026-08-13. No Deprecation pointer is emitted in apis.yml for that reason —
    crediting Google Cloud's policy to GA4 would over-state the commitment.
  nearest_general_policy: https://cloud.google.com/terms/deprecation
  policy_note: >-
    GA4's APIs are governed by Google's general deprecation posture: beta and alpha channels
    carry no deprecation guarantee, and the one-year notice in the Google Cloud deprecation
    policy applies to GA (v1) services, which GA4 does not have. Deprecations are announced
    in the per-API changelog, not via a machine-readable channel.
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  evidence: >-
    No Sunset or Deprecation response header is documented, and none appears in any of the
    four Discovery documents.
  announced_via: https://developers.google.com/analytics/devguides/config/admin/v1/changelog
deprecated_operations:
