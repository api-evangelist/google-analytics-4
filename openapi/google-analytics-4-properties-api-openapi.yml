          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleRpcStatus'
      security:
      - OAuth2:
        - analytics
        - analytics.readonly
      - BearerAuth: []
    servers:
    - url: https://analyticsdata.googleapis.com
      description: Google Analytics Data API
