            filter clause in the Audience.
          enum:
          - AUDIENCE_EXCLUSION_DURATION_MODE_UNSPECIFIED
          - EXCLUDE_TEMPORARILY
          - EXCLUDE_PERMANENTLY
          x-enumDescriptions:
