    GoogleAnalyticsAdminV1alphaAttributionSettings:
      type: object
      description: The attribution settings used for a given property. This is a singleton resource.
      properties:
        reportingAttributionModel:
          x-enumDescriptions:
          - Reporting attribution model unspecified.
          - Data-driven attribution distributes credit for the conversion based on data for each conversion
            event. Each Data-driven model is specific to each advertiser and each conversion event. Previously
            CROSS_CHANNEL_DATA_DRIVEN
          - Ignores direct traffic and attributes 100% of the conversion value to the last channel that
            the customer clicked through (or engaged view through for YouTube) before converting. Previously
            CROSS_CHANNEL_LAST_CLICK
          - Attributes 100% of the conversion value to the last Google Paid channel that the customer
            clicked through before converting. Previously ADS_PREFERRED_LAST_CLICK
          description: Required. The reporting attribution model used to calculate conversion credit in
            this property's reports. Changing the attribution model will apply to both historical and
            future data. These changes will be reflected in reports with conversion and revenue data.
            User and session data will be unaffected.
          enum:
          - REPORTING_ATTRIBUTION_MODEL_UNSPECIFIED
          - PAID_AND_ORGANIC_CHANNELS_DATA_DRIVEN
          - PAID_AND_ORGANIC_CHANNELS_LAST_CLICK
          - GOOGLE_PAID_CHANNELS_LAST_CLICK
          type: string
        acquisitionConversionEventLookbackWindow:
          type: string
          description: Required. The lookback window configuration for acquisition conversion events.
            The default window size is 30 days.
          enum:
          - ACQUISITION_CONVERSION_EVENT_LOOKBACK_WINDOW_UNSPECIFIED
          - ACQUISITION_CONVERSION_EVENT_LOOKBACK_WINDOW_7_DAYS
          - ACQUISITION_CONVERSION_EVENT_LOOKBACK_WINDOW_30_DAYS
          x-enumDescriptions:
          - Lookback window size unspecified.
          - 7-day lookback window.
          - 30-day lookback window.
        name:
          type: string
          description: 'Output only. Resource name of this attribution settings resource. Format: properties/{property_id}/attributionSettings
            Example: "properties/1000/attributionSettings"'
        otherConversionEventLookbackWindow:
          x-enumDescriptions:
          - Lookback window size unspecified.
          - 30-day lookback window.
          - 60-day lookback window.
          - 90-day lookback window.
          description: Required. The lookback window for all other, non-acquisition conversion events.
            The default window size is 90 days.
          enum:
          - OTHER_CONVERSION_EVENT_LOOKBACK_WINDOW_UNSPECIFIED
          - OTHER_CONVERSION_EVENT_LOOKBACK_WINDOW_30_DAYS
          - OTHER_CONVERSION_EVENT_LOOKBACK_WINDOW_60_DAYS
          - OTHER_CONVERSION_EVENT_LOOKBACK_WINDOW_90_DAYS
          type: string
        adsWebConversionDataExportScope:
          type: string
          x-enumDescriptions:
          - Default value. This value is unused.
          - No data export scope selected yet. Export scope can never be changed back to this value.
          - Paid and organic channels are eligible to receive conversion credit, but only credit assigned
            to Google Ads channels will appear in your Ads accounts. To learn more, see [Paid and Organic
            channels](https://support.google.com/analytics/answer/10632359).
          - Only Google Ads paid channels are eligible to receive conversion credit. To learn more, see
            [Google Paid channels](https://support.google.com/analytics/answer/10632359).
          description: Required. The Conversion Export Scope for data exported to linked Ads Accounts.
          enum:
          - ADS_WEB_CONVERSION_DATA_EXPORT_SCOPE_UNSPECIFIED
          - NOT_SELECTED_YET
          - PAID_AND_ORGANIC_CHANNELS
          - GOOGLE_PAID_CHANNELS
