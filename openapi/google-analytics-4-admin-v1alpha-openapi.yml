      type: object
    GoogleAnalyticsAdminV1alphaAudienceDimensionOrMetricFilter:
      description: A specific filter for a single dimension or metric.
      properties:
        atAnyPointInTime:
          description: Optional. Indicates whether this filter needs dynamic evaluation or not. If set
            to true, users join the Audience if they ever met the condition (static evaluation). If unset
            or set to false, user evaluation for an Audience is dynamic; users are added to an Audience
            when they meet the conditions and then removed when they no longer meet them. This can only
            be set when Audience scope is ACROSS_ALL_SESSIONS.
          type: boolean
        inListFilter:
          description: A filter for a string dimension that matches a particular list of options.
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAudienceDimensionOrMetricFilterInListFilter'
        betweenFilter:
          description: A filter for numeric or date values between certain values on a dimension or metric.
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAudienceDimensionOrMetricFilterBetweenFilter'
        fieldName:
          type: string
          description: Required. Immutable. The dimension name or metric name to filter. If the field
            name refers to a custom dimension or metric, a scope prefix will be added to the front of
            the custom dimensions or metric name. For more on scope prefixes or custom dimensions/metrics,
            reference the [Google Analytics Data API documentation] (https://developers.google.com/analytics/devguides/reporting/data/v1/api-schema#custom_dimensions).
        stringFilter:
          description: A filter for a string-type dimension that matches a particular pattern.
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAudienceDimensionOrMetricFilterStringFilter'
        numericFilter:
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAudienceDimensionOrMetricFilterNumericFilter'
          description: A filter for numeric or date values on a dimension or metric.
        inAnyNDayPeriod:
          description: Optional. If set, specifies the time window for which to evaluate data in number
            of days. If not set, then audience data is evaluated against lifetime data (For example, infinite
            time window). For example, if set to 1 day, only the current day's data is evaluated. The
            reference point is the current day when at_any_point_in_time is unset or false. It can only
            be set when Audience scope is ACROSS_ALL_SESSIONS and cannot be greater than 60 days.
          format: int32
          type: integer
      type: object
    GoogleAnalyticsAdminV1alphaParameterMutation:
      description: Defines an event parameter to mutate.
      properties:
        parameter:
          description: 'Required. The name of the parameter to mutate. This value must: * be less than
            40 characters. * be unique across across all mutations within the rule * consist only of letters,
            digits or _ (underscores) For event edit rules, the name may also be set to ''event_name''
            to modify the event_name in place.'
          type: string
        parameterValue:
          type: string
          description: Required. The value mutation to perform. * Must be less than 100 characters. *
            To specify a constant value for the param, use the value's string. * To copy value from another
            parameter, use syntax like "[[other_parameter]]" For more details, see this [help center article](https://support.google.com/analytics/answer/10085872#modify-an-event&zippy=%2Cin-this-article%2Cmodify-parameters).
      type: object
    GoogleAnalyticsAdminV1alphaSubpropertyEventFilterConditionStringFilter:
