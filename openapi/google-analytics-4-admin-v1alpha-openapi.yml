    GoogleAnalyticsAdminV1alphaAudienceSequenceFilterAudienceSequenceStep:
      description: A condition that must occur in the specified step order for this user to match the
        sequence.
      properties:
        immediatelyFollows:
          description: Optional. If true, the event satisfying this step must be the very next event after
            the event satisfying the last step. If unset or false, this step indirectly follows the prior
            step; for example, there may be events between the prior step and this step. It is ignored
            for the first step.
          type: boolean
        scope:
          type: string
          x-enumDescriptions:
          - Scope is not specified.
          - User joins the Audience if the filter condition is met within one event.
          - User joins the Audience if the filter condition is met within one session.
          - User joins the Audience if the filter condition is met by any event across any session.
          description: Required. Immutable. Specifies the scope for this step.
          enum:
          - AUDIENCE_FILTER_SCOPE_UNSPECIFIED
          - AUDIENCE_FILTER_SCOPE_WITHIN_SAME_EVENT
          - AUDIENCE_FILTER_SCOPE_WITHIN_SAME_SESSION
          - AUDIENCE_FILTER_SCOPE_ACROSS_ALL_SESSIONS
        filterExpression:
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAudienceFilterExpression'
          description: Required. Immutable. A logical expression of Audience dimension, metric, or event
            filters in each step.
        constraintDuration:
          type: string
          description: Optional. When set, this step must be satisfied within the constraint_duration
            of the previous step (For example, t[i] - t[i-1] <= constraint_duration). If not set, there
            is no duration requirement (the duration is effectively unlimited). It is ignored for the
            first step.
          format: google-duration
      type: object
