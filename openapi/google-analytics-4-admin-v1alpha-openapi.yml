    GoogleAnalyticsAdminV1alphaConversionEvent:
      description: A conversion event in a Google Analytics property.
      properties:
        custom:
          description: Output only. If set to true, this conversion event refers to a custom event. If
            set to false, this conversion event refers to a default event in GA. Default events typically
            have special meaning in GA. Default events are usually created for you by the GA system, but
            in some cases can be created by property admins. Custom events count towards the maximum number
            of custom conversion events that may be created per property.
          type: boolean
        countingMethod:
          type: string
          x-enumDescriptions:
          - Counting method not specified.
          - Each Event instance is considered a Conversion.
          - An Event instance is considered a Conversion at most once per session per user.
          description: Optional. The method by which conversions will be counted across multiple events
            within a session. If this value is not provided, it will be set to `ONCE_PER_EVENT`.
          enum:
          - CONVERSION_COUNTING_METHOD_UNSPECIFIED
          - ONCE_PER_EVENT
          - ONCE_PER_SESSION
        defaultConversionValue:
          description: Optional. Defines a default value/currency for a conversion event.
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaConversionEventDefaultConversionValue'
        eventName:
          description: 'Immutable. The event name for this conversion event. Examples: ''click'', ''purchase'''
          type: string
        name:
          type: string
          description: 'Identifier. Resource name of this conversion event. Format: properties/{property}/conversionEvents/{conversion_event}'
        createTime:
          type: string
          format: google-datetime
          description: Output only. Time when this conversion event was created in the property.
        deletable:
          description: Output only. If set, this event can currently be deleted with DeleteConversionEvent.
          type: boolean
      type: object
