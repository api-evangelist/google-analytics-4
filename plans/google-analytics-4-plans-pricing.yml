specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Google Analytics 4
providerId: google-analytics-4
created: '2026-05-04'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
source:
  - https://marketingplatform.google.com/about/analytics/
  - https://developers.google.com/analytics/devguides/reporting/data/v1/quotas
  - https://developers.google.com/analytics/devguides/config/admin/v1/quotas
note: >-
  Replaces a 2026-05-04 bulk-sweep scaffold that invented a "$0 / 1,000 requests per month"
  free tier and a paid tier with made-up prices. Google publishes exactly two Analytics
  tiers and publishes a price for neither in numeric form: the standard product is stated as
  free of charge, and Analytics 360 is enterprise contact-sales with no list price anywhere
  on Google's site. What IS published per tier is the API quota ceiling, so the quota is the
  real, citable tier differentiator and is recorded as such here.
tags:
  - Analytics
  - Data Collection
  - Marketing
  - Measurement
  - Reporting
description: >-
  Published plan structure for the Google Analytics 4 API surface. API access is not sold
  separately — it is bundled with the Analytics product tier the property sits on, and the
  tier determines the Data API quota. No API-specific SKU, metered API pricing or overage
  rate is published.
pricing_model: bundled-with-product
api_billed_separately: false
overage: none-published
currency: null
plan_count: 2
plans:
  - id: google-analytics-standard
    name: Google Analytics
    type: free
    price: '0.00'
    price_published: true
    price_note: >-
      Google states on marketingplatform.google.com: "Google Analytics gives you the tools,
      free of charge, to understand the customer journey and improve marketing ROI."
    billing_period: null
    description: >-
      The standard, no-cost Google Analytics 4 product. Full access to the Data API, Admin
      API and Measurement Protocol at the standard quota ceiling.
    entries:
      - label: Data API tokens per property per day
        name: data_api_tokens_day
        type: quota
        metric: tokens
        limit: 200000
        timeFrame: day
      - label: Data API tokens per property per hour
        name: data_api_tokens_hour
        type: quota
        metric: tokens
        limit: 40000
        timeFrame: hour
      - label: Data API tokens per project per property per hour
        name: data_api_tokens_project_hour
        type: quota
        metric: tokens
        limit: 14000
        timeFrame: hour
      - label: Concurrent Data API requests per property
        name: concurrent_requests
        type: rate
        metric: concurrent_requests
        limit: 10
        timeFrame: instant
      - label: Server errors per project per property per hour
        name: server_errors
        type: quota
        metric: server_errors
        limit: 10
        timeFrame: hour
    elements:
      - name: Google Analytics Data API
      - name: Google Analytics Admin API
      - name: Measurement Protocol
      - name: Public documentation
      - name: Self-serve signup
  - id: google-analytics-360
    name: Google Analytics 360
    type: enterprise
    price: null
    price_published: false
    price_note: >-
      No list price is published anywhere on Google's site. Analytics 360 is sold through
      Google sales and resellers on a quote basis. Recording price as null is a measurement,
      not a gap.
    billing_period: annual-contract
    description: >-
      The enterprise Analytics tier. Raises every published Data API quota by 10x and lifts
      concurrency 5x; sold via contact-sales through Google Marketing Platform.
    signup: https://marketingplatform.google.com/about/analytics-360/
    entries:
      - label: Data API tokens per property per day
        name: data_api_tokens_day
        type: quota
        metric: tokens
        limit: 2000000
        timeFrame: day
      - label: Data API tokens per property per hour
        name: data_api_tokens_hour
        type: quota
        metric: tokens
        limit: 400000
        timeFrame: hour
      - label: Data API tokens per project per property per hour
        name: data_api_tokens_project_hour
        type: quota
        metric: tokens
        limit: 140000
        timeFrame: hour
      - label: Concurrent Data API requests per property
        name: concurrent_requests
        type: rate
        metric: concurrent_requests
        limit: 50
        timeFrame: instant
      - label: Server errors per project per property per hour
        name: server_errors
        type: quota
        metric: server_errors
        limit: 50
        timeFrame: hour
      - label: Unsampled Data API reporting
        name: sampling_level
        type: feature
        description: >-
          The v1alpha reportTasks samplingLevel field exposes an UNSAMPLED option and access
          to 1 billion events for Analytics 360 properties (added 2024-10-15).
    elements:
      - name: Google Analytics Data API (10x quota)
      - name: Google Analytics Admin API
      - name: Measurement Protocol
      - name: Contact-sales onboarding
