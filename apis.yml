- aid: google-analytics-4:google-analytics-measurement-protocol
  name: Google Analytics Measurement Protocol
  description: >-
    The Measurement Protocol for Google Analytics 4 allows developers to send events directly to Google
    Analytics servers for web and app streams. Fire-and-forget: the production endpoint returns HTTP 204
    with an empty body and never reports validation errors, so a separate validation endpoint exists.
    Authenticates with a per-data-stream api_secret rather than OAuth.
  image: https://www.gstatic.com/analytics-suite/header/suite/v2/ic_analytics.svg
  humanURL: https://developers.google.com/analytics/devguides/collection/protocol/ga4
