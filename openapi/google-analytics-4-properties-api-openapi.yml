          type: string
          pattern: ^properties/[^/]+$
        description: 'Required. The parent resource where this audience list will be created. Format: `properties/{property}`'
      - name: propertiesId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
