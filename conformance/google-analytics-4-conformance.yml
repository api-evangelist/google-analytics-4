  - id: google-aip-resource-oriented-design
    conforms: true
    evidence: >-
      Relative resource names, AIP-136 custom methods (:runReport), AIP-134 updateMask field
      masks on 38 patch operations, AIP-158 pageSize/pageToken/nextPageToken on 44 list
      operations.
