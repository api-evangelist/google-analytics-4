    version: v1beta
    item: sharingWithGoogleAnySalesEnabled
    detail: >-
      Deprecated; always returns false. Google scheduled removal for June 2025 — the field is
      still present in the 20260810 Discovery revision.
  - date: '2025-08-20'
    version: v1alpha
    item: Universal Analytics methods
    detail: Legacy Universal Analytics methods removed from the Admin API.
  - date: '2024-08-01'
    version: v1alpha
    item: createSubproperty
    detail: Renamed to provisionSubproperty. Breaking change, announced in the changelog only.
  - date: '2024-05-06'
    version: v1beta and v1alpha
