sla:
  url: null
  uptime_target: null
  note: >-
    No SLA is published for the standard (free) Analytics tier. Analytics 360 service terms
    are contractual and not publicly posted; no numeric uptime target for the GA4 APIs
    appears on any public Google page.
status_page: https://www.google.com/appsstatus/dashboard/
status_page_secondary: https://status.cloud.google.com/
status_page_note: >-
  Google Analytics does not run a dedicated GA4 API status page. Analytics incidents are
  posted on the Google Workspace Status Dashboard; the Google Cloud Service Health dashboard
  covers the googleapis.com serving infrastructure the two API hosts sit behind. Both are
  Google-operated and both return HTTP 200. Neither is GA4-scoped, which is a real gap: an
  agent cannot determine whether analyticsdata.googleapis.com specifically is degraded.
