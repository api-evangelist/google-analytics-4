cross_api_join:
  note: >-
    The Admin API and the Data API share exactly one join key — the property resource name.
    An agent discovers properties via accountSummaries_list on the Admin API, then passes
    properties/{propertyId} as the `property` path parameter to every Data API reporting
    operation. Custom dimensions and metrics created through the Admin API become queryable
    dimension/metric names in the Data API, discoverable via properties_getMetadata.
