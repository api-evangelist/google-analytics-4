summary:
  conformant: 9
  partial: 2
  non_conformant: 11
  headline: >-
    Strong on identity and on Google's own house standards; absent on every open API
    discovery standard. The contract is real and complete but is published in a proprietary
    format, and the agent-facing discovery layer (llms.txt, api-catalog, agent card) does not
    exist.
