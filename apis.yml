- aid: google-analytics-4:google-analytics-admin-api
  name: Google Analytics Admin API
  description: >-
    Configuration API for GA4 — accounts, properties, data streams, Measurement Protocol secrets,
    custom dimensions and metrics, key events, data retention and redaction settings, audiences,
    access bindings, and links to Google Ads, Firebase, BigQuery, AdSense, Display & Video 360 and
    Search Ads 360. 55 operations on v1beta and 166 on v1alpha, harvested from Google's own
    Discovery documents.
