components:
  schemas:
    GoogleAnalyticsAdminV1alphaProvisionAccountTicketRequest:
      type: object
      description: Request message for ProvisionAccountTicket RPC.
      properties:
        redirectUri:
          type: string
          description: Redirect URI where the user will be sent after accepting Terms of Service. Must
            be configured in Cloud Console as a Redirect URI.
        account:
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaAccount'
          description: The account to create.
    GoogleAnalyticsAdminV1alphaDataStreamWebStreamData:
      description: Data specific to web streams.
      properties:
        firebaseAppId:
          description: Output only. ID of the corresponding web app in Firebase, if any. This ID can change
            if the web app is deleted and recreated.
          type: string
        measurementId:
          description: 'Output only. Analytics Measurement ID. Example: "G-1A2BCD345E"'
          type: string
        defaultUri:
          description: 'Domain name of the web app being measured, or empty. Example: "http://www.google.com",
            "https://www.google.com"'
          type: string
      type: object
    GoogleAnalyticsAdminV1alphaAccessDimension:
      description: Dimensions are attributes of your data. For example, the dimension `userEmail` indicates
        the email of the user that accessed reporting data. Dimension values in report responses are strings.
      properties:
        dimensionName:
          type: string
          description: The API name of the dimension. See [Data Access Schema](https://developers.google.com/analytics/devguides/config/admin/v1/access-api-schema)
            for the list of dimensions supported in this API. Dimensions are referenced by name in `dimensionFilter`
            and `orderBys`.
      type: object
    GoogleAnalyticsAdminV1alphaAccessBetweenFilter:
      description: To express that the result needs to be between two numbers (inclusive).
      properties:
        fromValue:
          description: Begins with this number.
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaNumericValue'
        toValue:
          description: Ends with this number.
          $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaNumericValue'
      type: object
    GoogleAnalyticsAdminV1alphaListGoogleAdsLinksResponse:
      description: Response message for ListGoogleAdsLinks RPC.
      properties:
        googleAdsLinks:
          type: array
          items:
            $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaGoogleAdsLink'
          description: List of GoogleAdsLinks.
        nextPageToken:
          description: A token, which can be sent as `page_token` to retrieve the next page. If this field
            is omitted, there are no subsequent pages.
          type: string
      type: object
    GoogleAnalyticsAdminV1alphaPostbackWindow:
      description: Settings for a SKAdNetwork conversion postback window.
      properties:
        postbackWindowSettingsEnabled:
          description: If enable_postback_window_settings is true, conversion_values must be populated
            and will be used for determining when and how to set the Conversion Value on a client device
            and exporting schema to linked Ads accounts. If false, the settings are not used, but are
            retained in case they may be used in the future. This must always be true for postback_window_one.
          type: boolean
        conversionValues:
          type: array
          items:
            $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaConversionValues'
          description: Ordering of the repeated field will be used to prioritize the conversion value
            settings. Lower indexed entries are prioritized higher. The first conversion value setting
            that evaluates to true will be selected. It must have at least one entry if enable_postback_window_settings
            is set to true. It can have maximum of 128 entries.
      type: object
    GoogleAnalyticsAdminV1alphaListMeasurementProtocolSecretsResponse:
      description: Response message for ListMeasurementProtocolSecret RPC
      properties:
        measurementProtocolSecrets:
          description: A list of secrets for the parent stream specified in the request.
          type: array
          items:
            $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaMeasurementProtocolSecret'
