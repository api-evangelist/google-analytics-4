    GoogleAnalyticsAdminV1alphaEventCreateRule:
      description: An Event Create Rule defines conditions that will trigger the creation of an entirely
        new event based upon matched criteria of a source event. Additional mutations of the parameters
        from the source event can be defined. Unlike Event Edit rules, Event Creation Rules have no defined
        order. They will all be run independently. Event Edit and Event Create rules can't be used to
        modify an event created from an Event Create rule.
      properties:
        eventConditions:
          type: array
          items:
            $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaMatchingCondition'
          description: Required. Must have at least one condition, and can have up to 10 max. Conditions
