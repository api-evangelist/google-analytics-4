        fineValue:
          type: integer
          description: The fine-grained conversion value. This is applicable only to the first postback
            window. Its valid values are [0,63], both inclusive. It must be set for postback window 1,
            and must not be set for postback window 2 & 3. This value is not guaranteed to be unique.
            If the configuration for the first postback window is re-used for second or third postback
            windows this field has no effect.
          format: int32
        eventMappings:
          type: array
          items:
            $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaEventMapping'
          description: Event conditions that must be met for this Conversion Value to be achieved. The
            conditions in this list are ANDed together. It must have minimum of 1 entry and maximum of
            3 entries, if the postback window is enabled.
        coarseValue:
          description: Required. A coarse grained conversion value. This value is not guaranteed to be
            unique.
          enum:
          - COARSE_VALUE_UNSPECIFIED
          - COARSE_VALUE_LOW
          - COARSE_VALUE_MEDIUM
          - COARSE_VALUE_HIGH
          x-enumDescriptions:
          - Coarse value not specified.
          - Coarse value of low.
          - Coarse value of medium.
          - Coarse value of high.
          type: string
        lockEnabled:
          description: If true, the SDK should lock to this conversion value for the current postback
            window.
          type: boolean
      type: object
