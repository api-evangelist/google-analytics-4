        name:
          description: 'Output only. Resource name for this EventCreateRule resource. Format: properties/{property}/dataStreams/{data_stream}/eventCreateRules/{event_create_rule}'
          type: string
        sourceCopyParameters:
          type: boolean
          description: If true, the source parameters are copied to the new event. If false, or unset,
            all non-internal parameters are not copied from the source event. Parameter mutations are
            applied after the parameters have been copied.
        parameterMutations:
          type: array
          items:
            $ref: '#/components/schemas/GoogleAnalyticsAdminV1alphaParameterMutation'
          description: Parameter mutations define parameter behavior on the new event, and are applied
